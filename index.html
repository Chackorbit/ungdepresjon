<!DOCTYPE html>

  <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon" />
  <title>Ung Depresjon, powered by Olsys</title>
  <meta name="description"
    content="A preventative platform, aimed at teaching young people the knowledge they need to survive in a challenging and rapidly evolving world, adapted to the modern end user. The app will offer help to those struggling with depressive symptoms." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("page-loader");
      const renderStart = performance.now();

      const pageLoaded = new Promise((resolve) => {
        window.addEventListener("load", () => resolve(), { once: true });
      });

      const minTime = new Promise((resolve) => {
        const elapsed = performance.now() - renderStart;
        const wait = Math.max(1000 - elapsed, 0);
        setTimeout(resolve, wait);
      });

      Promise.all([pageLoaded, minTime]).then(() => {
        if (loader) {
          loader.style.transition = "opacity 0.4s ease";
          loader.style.opacity = "0";
          setTimeout(() => {
            loader.style.display = "none";
          }, 400);
        }
      });
    });
  </script>

  <div id="page-loader" style="
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  ">
    <div style="
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid #000;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    "></div>
  </div>
